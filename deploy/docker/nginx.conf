server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed filenames, so these are immutable — a changed file gets a new name.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Never cached. It is the file that points at the current asset hashes, so a stale
    # copy would keep serving a deployed-over build indefinitely.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # The API is proxied rather than called cross-origin, which is why the console needs
    # no CORS configuration and no build-time API URL. One image, every environment.
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generous, because starting a run can involve planning a large table. Kept
        # finite so a wedged backend surfaces as a timeout rather than a hung browser tab.
        proxy_read_timeout 300s;
    }

    location /actuator/ {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
    }

    # Client-side routing: /runs/abc123 is a React route, not a file on disk, so
    # anything unmatched falls through to the app rather than 404ing.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
