# =============================================================================
# Ships the application's JSON log into OpenSearch.
#
# Reads a file rather than the container's stdout. Stdout would mean mounting Docker's own
# storage, which is not reachable from the host on Docker Desktop and needs privileges anywhere
# else; a shared volume works identically on every machine and needs none.
#
# The platform already writes two things to OpenSearch — what happened to each record, and what
# the platform did. This is the third and least structured: the narration. A stack trace, a
# connector's aside, a warning nobody modelled. It is the one people actually reach for when
# something is wrong in a way nobody anticipated.
# =============================================================================

[SERVICE]
    Flush         2
    Daemon        Off
    Log_Level     info
    Parsers_File  parsers.conf

[INPUT]
    Name              tail
    Path              /app/logs/dmp-app.json
    Tag               dmp.app
    Parser            json
    # Survives a restart of this container without re-reading the whole file, which would
    # duplicate every line already indexed.
    DB                /var/log/flb-dmp.db
    Refresh_Interval  2
    # A stack trace is one event whose message spans many lines. The application writes it as a
    # single JSON object, so nothing needs stitching here — this is only a guard against a
    # partially written line being read before its newline arrives.
    Skip_Long_Lines   On
    Mem_Buf_Limit     16MB

[OUTPUT]
    Name            opensearch
    Match           dmp.*
    Host            opensearch
    Port            9200
    # One index per day. Application logs are the highest-volume and least valuable of the three
    # stores, so they are the ones you want to be able to drop by the day.
    Index           dmp-app-log
    Logstash_Format On
    Logstash_Prefix dmp-app-log
    Time_Key        @timestamp
    # ECS already carries a timestamp; adding Fluent Bit's own would give every document two.
    Time_Key_Nanos  Off
    Suppress_Type_Name On
    tls             Off
    # Never block the application. If OpenSearch is unreachable the buffer fills and lines are
    # dropped — losing log lines is the correct failure here, because the alternative is back
    # pressure that reaches a running migration.
    Retry_Limit     3
