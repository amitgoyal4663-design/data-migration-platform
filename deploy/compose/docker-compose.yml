# =============================================================================
# The whole platform, locally.
#
#   make up      infrastructure only (for running the app from an IDE)
#   make stack   everything, including the app and the console
#
# Console:   http://localhost:3000
# API docs:  http://localhost:8080/swagger-ui.html
#
# MongoDB runs as a single-node REPLICA SET, not a standalone mongod. This is not
# optional and not a production-only concern: change streams require an oplog, and
# the delay queue depends on them. A standalone mongod would accept every write in
# this platform and then silently never fire a timer.
# =============================================================================

name: dmp

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — definitions: tenants, pipelines, versions, connectors, audit.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:17-alpine
    container_name: dmp-postgres
    environment:
      POSTGRES_DB: dmp
      POSTGRES_USER: dmp
      POSTGRES_PASSWORD: dmp
      # C collation makes index ordering deterministic across platforms, so a query
      # plan reproduced from production behaves the same on a developer's machine.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${DMP_PORT_POSTGRES:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the demo tables the migration walkthrough uses. Runs once, on an
      # empty data directory.
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dmp -d dmp"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      # Logs any statement over a second. The point of a local stack is to notice a
      # missing index here rather than in production.
      - -c
      - log_min_duration_statement=1000

  # ---------------------------------------------------------------------------
  # MongoDB — execution: runs, chunks, checkpoints, dead-letter queue, timers.
  # ---------------------------------------------------------------------------
  mongo:
    image: mongo:8
    container_name: dmp-mongo
    command: ["--replSet", "rs0", "--bind_ip_all", "--port", "27017"]
    ports:
      # Host port 27018 so this does not collide with a MongoDB already running on the
      # machine. Inside the Compose network it is still mongo:27017, so nothing in the
      # application configuration changes — only how you reach it from outside.
      - "${DMP_PORT_MONGO:-27018}:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      # Reports healthy only once the replica set has a PRIMARY. Waiting on the port
      # alone would let the application start against a set still holding an election,
      # which fails writes in a way that looks like an application bug.
      test: |
        mongosh --quiet --eval '
          try { rs.status().ok && rs.status().members.some(m => m.stateStr === "PRIMARY") ? 0 : 1 }
          catch (e) { 1 }
        '
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 10s

  mongo-init:
    image: mongo:8
    container_name: dmp-mongo-init
    depends_on:
      mongo:
        condition: service_started
    restart: "no"
    # Initiates the replica set once, then exits. Re-running is harmless: an already
    # initiated set returns AlreadyInitialized, which is swallowed so a restarted
    # stack does not report a spurious failure.
    entrypoint:
      - bash
      - -c
      - |
        for i in $$(seq 1 30); do
          mongosh --host mongo:27017 --quiet --eval 'db.adminCommand({ping: 1})' && break
          sleep 2
        done
        mongosh --host mongo:27017 --quiet --eval '
          try {
            rs.initiate({_id: "rs0", members: [{_id: 0, host: "mongo:27017"}]});
            print("replica set initiated");
          } catch (e) {
            if (e.codeName === "AlreadyInitialized") { print("replica set already initiated"); }
            else { throw e; }
          }
        '

  # ---------------------------------------------------------------------------
  # Kafka — not required by the execution engine (ADR-0014). Present for the delay
  # queue's final hop and for pipelines that name a Kafka topic as source or sink.
  # The platform never creates a topic; auto-creation is off so development matches
  # production, where the service account has no authority to create one.
  # ---------------------------------------------------------------------------
  kafka:
    image: apache/kafka:3.9.0
    container_name: dmp-kafka
    ports:
      - "${DMP_PORT_KAFKA:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,EXTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: dmp-local-cluster-0001
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  # ---------------------------------------------------------------------------
  # Redis — rate limits, progress counters, caches.
  # Invariant: nothing here may be the only copy of anything.
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: dmp-redis
    ports:
      - "${DMP_PORT_REDIS:-6379}:6379"
    # No persistence, on purpose. If losing Redis breaks the platform, something is
    # stored here that should not be — and that should surface in development rather
    # than during an incident.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10


  # ---------------------------------------------------------------------------
  # The record index (ADR-0011 record-level audit).
  #
  # Only pipelines whose audit level is INDEXED write here, and they write one
  # entry per record — identities always, content when the pipeline opts in.
  # A pipeline set to index its records against a deployment without this
  # running is stopped rather than completed, because an empty index and a
  # migration that never happened look identical to whoever searches later.
  #
  # Security is disabled for local development only. Anywhere else this holds
  # customer identifiers, and content too when payload indexing is on.
  # ---------------------------------------------------------------------------
  opensearch:
    image: opensearchproject/opensearch:2.18.0
    container_name: dmp-opensearch
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
      bootstrap.memory_lock: "true"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports:
      - "${DMP_PORT_OPENSEARCH:-9200}:9200"
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # Search UI over the record index. Nothing depends on it — it is for people.
  opensearch-dashboards:
    image: opensearchproject/opensearch-dashboards:2.18.0
    container_name: dmp-dashboards
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      OPENSEARCH_HOSTS: '["http://opensearch:9200"]'
      DISABLE_SECURITY_DASHBOARDS_PLUGIN: "true"
    ports:
      - "${DMP_PORT_DASHBOARDS:-5601}:5601"

  # ---------------------------------------------------------------------------
  # The platform. Runs both roles under the `all` profile.
  #
  # To split them, run this image twice with control-plane and worker profiles;
  # they communicate only through the datastores, never in process.
  # ---------------------------------------------------------------------------
  app:
    build:
      context: ../..
      dockerfile: deploy/docker/backend.Dockerfile
    container_name: dmp-app
    profiles: ["full"]
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      opensearch:
        condition: service_healthy
      redis:
        condition: service_started
      # Topics must exist before anything reads or writes them, and this platform will
      # not create them — see kafka-init.
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "${DMP_PORT_API:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: all
      # Record-index entries go to Kafka and a consumer indexes them, rather than each
      # chunk waiting on OpenSearch. Set to anything else and writes go straight there,
      # which is the older arrangement and needs no topic.
      DMP_RECORDINDEX_QUEUE: kafka
      DMP_POSTGRES_URL: jdbc:postgresql://postgres:5432/dmp
      DMP_POSTGRES_USER: dmp
      DMP_POSTGRES_PASSWORD: dmp
      DMP_MONGO_URI: mongodb://mongo:27017/dmp?replicaSet=rs0
      DMP_RECORDINDEX_ENABLED: "true"
      # Both halves of the search story, and they are separate switches: the record
      # index answers "what happened to this record", the stage log answers "what did
      # the platform do". A stack shipped with the first and not the second has a
      # timeline that is permanently empty and says so in a way nobody believes.
      DMP_RECORDLOG_OPENSEARCH_ENABLED: "true"
      DMP_RECORDLOG_OPENSEARCH_URL: http://opensearch:9200
      DMP_REDIS_HOST: redis
      DMP_REDIS_PORT: "6379"
      DMP_EVENTS_KAFKA_ENABLED: "true"
      DMP_KAFKA_BOOTSTRAP: kafka:19092
      # DEBUG by default in this stack, because the whole point of shipping logs to OpenSearch is
      # being able to reconstruct a chunk — and at INFO a chunk produces one line. In production
      # this belongs at INFO with DEBUG turned on for the run being investigated.
      DMP_LOG_LEVEL: ${DMP_LOG_LEVEL:-DEBUG}
      # A JSON copy of every line, on a volume the shipper reads. The console stays human-readable.
      DMP_LOG_FILE: /app/logs/dmp-app.json
      # Resolved by connector instances that reference env:DEMO_PG_USER — references,
      # never values, are what the definition store holds.
      DEMO_PG_USER: dmp
      DEMO_PG_PASSWORD: dmp
      # Same rule for real credentials: the definition store holds env:DBX_TOKEN, and
      # the value arrives here. Empty by default so the stack starts without anyone
      # holding a Salesforce org — the connectors that need them fail their own
      # connection test with a message naming the field, and nothing else is affected.
      DBX_TOKEN: ${DBX_TOKEN:-local-mock-token}
      SF_CLIENT_ID: ${SF_CLIENT_ID:-}
      SF_CLIENT_SECRET: ${SF_CLIENT_SECRET:-}
    volumes:
      # Third-party connector jars. One subdirectory per connector.
      - ./plugins:/app/plugins:ro
      - app-logs:/app/logs
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Kafka topics, created before the app starts.
  #
  # The platform deliberately cannot create a topic: in the environments this runs
  # in, topics are provisioned by another team on request, and a job whose topic is
  # missing must stop and say so rather than quietly conjuring one. This service is
  # that other team, for a laptop. Broker-side auto-creation stays off.
  # ---------------------------------------------------------------------------
  kafka-init:
    image: apache/kafka:3.9.0
    container_name: dmp-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for topic in dmp.run.events.v1 dmp.work.available.v1 dmp.record.index.v1 orders.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 \
            --create --if-not-exists --topic "$$topic" \
            --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:19092 --list
    restart: "no"

  # ---------------------------------------------------------------------------
  # A fake Databricks warehouse, and a fake customer API to push into.
  #
  # Here so the stack demonstrates something the moment it is up. Nothing in the
  # platform depends on it; delete the service and the platform is unchanged.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Creates the connections and pipelines a new machine has none of, then exits.
  #
  # Idempotent by name, so it is safe on every start: it adds what is missing and
  # leaves everything else — including anything you built yourself — alone.
  # ---------------------------------------------------------------------------
  seed:
    image: python:3.12-alpine
    container_name: dmp-seed
    profiles: ["full"]
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - ../seed:/seed:ro
    environment:
      DMP_API: http://app:8080
    command: ["python", "/seed/seed.py"]
    restart: "no"

  databricks-mock:
    build:
      context: ../../mocks/databricks
      dockerfile: Dockerfile
    container_name: dmp-databricks-mock
    profiles: ["full"]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MOCK_MONGO_URI: mongodb://mongo:27017/?replicaSet=rs0
      # Polls a statement stays PENDING before succeeding. Raise it to watch the platform
      # wait on a slow warehouse without holding a worker.
      MOCK_PENDING_POLLS: ${MOCK_PENDING_POLLS:-1}
      # Result chunks that refuse before they work, as "index x times" — "3x2,7x99" fails chunk 3
      # twice then serves it, and fails chunk 7 more often than any pipeline will retry.
      MOCK_FAIL_CHUNKS: ${MOCK_FAIL_CHUNKS:-}
      # The same idea for the one-statement-per-chunk mode, keyed by the query's OFFSET, which is
      # the only thing identifying a chunk when every chunk has its own statement.
      MOCK_SLOW_OFFSETS: ${MOCK_SLOW_OFFSETS:-}
      MOCK_FAIL_OFFSETS: ${MOCK_FAIL_OFFSETS:-}
      # The customer API refuses any batch containing this string — a whole-call failure.
      MOCK_FAIL_INGEST_CONTAINING: ${MOCK_FAIL_INGEST_CONTAINING:-}
    ports:
      - "${DMP_PORT_MOCK:-8099}:8099"
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Ships the application's own logs into OpenSearch.
  #
  # The third of three stores, and the least structured: the record index says what happened to
  # each record, the stage log says what the platform did, and this says what it had to say about
  # it — a stack trace, a connector's aside, a warning nobody modelled in advance.
  # ---------------------------------------------------------------------------
  log-shipper:
    image: fluent/fluent-bit:3.1.9
    container_name: dmp-log-shipper
    profiles: ["full"]
    depends_on:
      opensearch:
        condition: service_healthy
    volumes:
      - app-logs:/app/logs:ro
      - ../docker/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf:ro
      - ../docker/fluent-bit-parsers.conf:/fluent-bit/etc/parsers.conf:ro
      - shipper-state:/var/log
    restart: unless-stopped

  console:
    build:
      context: ../..
      dockerfile: deploy/docker/console.Dockerfile
    container_name: dmp-console
    profiles: ["full"]
    depends_on:
      - app
    ports:
      - "${DMP_PORT_CONSOLE:-3000}:80"
    restart: unless-stopped

volumes:
  app-logs:
  shipper-state:
  opensearch-data:
  postgres-data:
  mongo-data:
  kafka-data:
